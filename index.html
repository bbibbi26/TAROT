<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Light - 타로 & 점성술</title>
  <style>
    /* 1. 디자인 시스템 (컬러 변수 정의) */
    :root {
      /* 배경: 밝은 아이보리 & 소프트 라벤더 */
      --bg-cream: #FAFAF7;
      --bg-lavender: #F3EDF7;
      
      /* 포인트 컬러: 화사한 바이올렛 & 샴페인 골드 */
      --primary-purple: #8A4FFF;
      --accent-gold: #D4AF37;
      --gold-glow: rgba(212, 175, 55, 0.3);
      
      /* 텍스트 & 테두리 */
      --text-main: #2B2536;
      --text-sub: #6E6879;
      --card-border: rgba(212, 175, 55, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-cream) 0%, var(--bg-lavender) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 2. 헤더 영역 */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(250, 250, 247, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary-purple);
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-gold);
    }

    /* 3. 히어로 섹션 */
    .hero {
      text-align: center;
      padding: 80px 20px 40px;
      max-width: 600px;
    }

    .hero-sparkle {
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 12px;
    }

    .hero h1 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-bottom: 16px;
      font-weight: 700;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    /* 4. 타로/점성술 카드 컴포넌트 */
    .cards-container {
      display: flex;
      gap: 24px;
      padding: 40px 20px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      width: 260px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(138, 79, 255, 0.05);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* 카드 호버 효과 (골드 라이트 & 부드러운 확대) */
    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-gold);
      box-shadow: 0 15px 35px var(--gold-glow);
    }

    .card-icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 1.25rem;
      color: var(--primary-purple);
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 5. 버튼 스타일 */
    .btn-gold {
      margin-top: 20px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #E5C158 0%, #D4AF37 100%);
      color: #FFF;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--gold-glow);
      transition: opacity 0.2s;
    }

    .btn-gold:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="logo">✨ Celestial <span>Tarot</span></div>
  </header>

  <!-- 히어로 메인 섹션 -->
  <section class="hero">
    <div class="hero-sparkle">✦ ✧ ✦</div>
    <h1>당신의 운명을 밝히는 별의 조언</h1>
    <p>어두운 밤이 아닌 화사한 빛으로 마음을 비춰드립니다.<br>오늘의 타로 카드와 별자리 운세를 확인해 보세요.</p>
    <button class="btn-gold">오늘의 운세 보기</button>
  </section>

  <!-- 카드 영역 -->
  <section class="cards-container">
    <div class="card">
      <div class="card-icon">🔮</div>
      <h3>오늘의 타로</h3>
      <p>당신의 직관을 따라 한 장의 카드를 선택해 보세요.</p>
    </div>

    <div class="card">
      <div class="card-icon">⭐</div>
      <h3>점성술 운세</h3>
      <p>행성의 배치와 황도 12궁이 전하는 메시지입니다.</p>
    </div>

    <div class="card">
      <div class="card-icon">🌙</div>
      <h3>달의 주기</h3>
      <p>신월과 만월이 가져다주는 에너지 흐름을 읽습니다.</p>
    </div>
  </section>

</body>
</html>
