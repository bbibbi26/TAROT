<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial - 현대적인 타로 & 점성술</title>
  <style>
    /* 1. 현대적인 컬러 팔레트 & 변수 정의 */
    :root {
      --bg-base: #F8F6FC;
      --bg-accent: #EFEAF8;
      
      --purple-main: #7C4DFF;
      --purple-light: #B388FF;
      --gold-main: #D4AF37;
      --gold-light: #F3E5AB;
      
      --text-heading: #1A1528;
      --text-body: #5A5266;
      
      /* 글래스모피즘 & 쉐도우 */
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow-soft: 0 20px 40px rgba(124, 77, 255, 0.08);
      --shadow-hover: 0 30px 60px rgba(124, 77, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #FAF7FF 0%, var(--bg-base) 70%, var(--bg-accent) 100%);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* 2. 네비게이션 (유리 질감 적용) */
    header {
      width: 100%;
      padding: 18px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--purple-main), var(--gold-main));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* 3. 히어로 섹션 */
    .hero {
      text-align: center;
      padding: 100px 20px 50px;
      max-width: 680px;
      position: relative;
    }

    /* 빛나는 백그라운드 후광 효과 */
    .hero-glow {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(179, 136, 255, 0.25) 0%, rgba(255,255,255,0) 70%);
      z-index: -1;
      filter: blur(40px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #A38011;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 2.8rem;
      color: var(--text-heading);
      margin-bottom: 20px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--purple-main) 0%, #A259FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-body);
      font-weight: 400;
    }

    /* 4. 카드 컨테이너 & 카드 디자인 (그라데이션 테두리) */
    .cards-container {
      display: flex;
      gap: 28px;
      padding: 40px 20px 80px;
      max-width: 1000px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card-wrapper {
      position: relative;
      border-radius: 24px;
      padding: 1px; /* 테두리 두께 */
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.4), rgba(124, 77, 255, 0.15));
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 23px;
      padding: 40px 28px;
      width: 280px;
      text-align: center;
      box-shadow: var(--shadow-soft);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-wrapper:hover {
      transform: translateY(-10px);
      background: linear-gradient(135deg, var(--gold-main), var(--purple-main));
      box-shadow: var(--shadow-hover);
    }

    .card-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124, 77, 255, 0.1), rgba(212, 175, 55, 0.15));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .card h3 {
      font-size: 1.3rem;
      color: var(--text-heading);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    /* 5. 현대적인 CTA 버튼 */
    .btn-gold {
      margin-top: 36px;
      padding: 16px 36px;
      background: linear-gradient(135deg, #EAD07D 0%, #D4AF37 100%);
      color: #2A2100;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .btn-gold:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.45);
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="logo">✦ CELESTIAL</div>
  </header>

  <!-- 히어로 메인 섹션 -->
  <section class="hero">
    <div class="hero-glow"></div>
    <div class="badge">✨ DAILY ASTROLOGY & TAROT</div>
    <h1>빛으로 읽는<br>당신의 <span>오늘과 내일</span></h1>
    <p>투명하고 화사한 별빛의 조언으로 마음을 정리해 보세요.<br>당신만을 위한 섬세한 운세 리딩이 준비되어 있습니다.</p>
    <button class="btn-gold">지금 리딩 시작하기</button>
  </section>

  <!-- 카드 영역 -->
  <section class="cards-container">
    <div class="card-wrapper">
      <div class="card">
        <div class="card-icon-box">🔮</div>
        <h3>오늘의 타로</h3>
        <p>당신의 직관을 따라 한 장의 카드를 선택하고 정교한 메시지를 받아보세요.</p>
      </div>
    </div>

    <div class="card-wrapper">
      <div class="card">
        <div class="card-icon-box">✦</div>
        <h3>별자리 운세</h3>
      <p>행성의 이동과 황도 12궁이 전하는 섬세한 에너지를 확인해 보세요.</p>
      </div>
    </div>

    <div class="card-wrapper">
      <div class="card">
        <div class="card-icon-box">🌙</div>
        <h3>달의 사이클</h3>
        <p>신월과 만월이 가져다주는 변화와 성장의 흐름을 읽어드립니다.</p>
      </div>
    </div>
  </section>

</body>
</html>

</body>
</html>
